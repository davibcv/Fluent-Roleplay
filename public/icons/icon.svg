  <text x="256" y="295" font-family="system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="160" font-weight="800" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="-4">FR</text>
  <circle cx="370" cy="155" r="14" fill="#ec4899" />
